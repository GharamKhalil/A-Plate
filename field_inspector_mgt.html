<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المفتشين الميدانيين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        /* التنسيق الموحد */
        body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2d; color: #d0d0e0; }
        header { background: #28283c; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #00aaff; }
        header img { height: 40px; margin-left: 15px; }
        .logo-text { font-size: 24px; font-weight: bold; color: white; }
        .main-layout { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 60px); }
        
        /* شريط التنقل الجانبي (Sidebar) */
        .sidebar { background: #2a2a3e; padding: 10px 0; }
        .sidebar a { 
            display: flex;
            align-items: center;
            padding: 14px 30px; 
            text-decoration: none; 
            color: #d0d0e0; 
            font-size: 15px; 
            transition: background 0.3s, color 0.3s; 
            border-right: 4px solid transparent; 
            font-weight: 500;
            gap: 10px;
        }
        .sidebar a:hover, .sidebar .active { 
            background: #3c3c5c; 
            border-right-color: #00aaff; 
            color: white; 
        }
        /* تم تعديل اسم الفئة من .material-icons-outlined إلى .sidebar a i */
        .sidebar a i {
            font-size: 20px;
            color: #d0d0e0;
        }
        .sidebar .active i {
            color: white;
        }
        
        /* محتوى المفتشين */
        .content { 
            padding: 20px; 
            display: grid; 
            /* تم تعديل الـ grid-template-columns لضمان عرض 1fr للخريطة و 300px للقائمة مع الأخذ بعين الاعتبار الهيكل العربي */
            grid-template-columns: 1fr 300px; 
            gap: 20px; 
        }
        #inspector-map { 
            /* يتم وضع الخريطة في العمود الأول */
            grid-column: 1 / 2; 
            height: 100%; 
            border-radius: 8px; 
            /* فلتر لتغميق الخريطة لتتناسب مع التصميم الداكن */
            filter: invert(90%) hue-rotate(180deg); 
        }
        .inspector-list { 
            /* يتم وضع القائمة في العمود الثاني */
            grid-column: 2 / 3;
            background: #2a2a3e; 
            padding: 20px; 
            border-radius: 8px; 
            overflow-y: auto; 
        }
        /* *************** Card Styles *************** */
        .inspector-card { background: #3c3c5c; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; 
            /* تصحيح RTL: حدود البطاقة تكون على اليسار */
            border-left: 4px solid transparent; 
            transition: background 0.2s, border-left-color 0.2s; 
        }
        .inspector-card:hover { background: #4a4a6e; }
        .inspector-card.active { 
            /* تصحيح RTL: تفعيل لون الحد على اليسار */
            border-left-color: #00aaff; 
        }
        .inspector-card h4 { margin: 0 0 5px 0; display: flex; justify-content: space-between; align-items: center; }
        .inspector-status { font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
        .status-available { background: #1abc9c; color: white; }
        .status-on-task { background: #ffc107; color: #3c3c5c; }
        .status-offline { background: #dc3545; color: white; }
        .assign-btn { background: #00aaff; color: white; border: none; padding: 8px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; margin-top: 5px; }

        /* أيقونة المفتش الميداني (Leaflet Custom Icon) */
        .inspector-icon { 
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23FFFFFF"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.38 0 2.5 1.12 2.5 2.5S13.38 10 12 10 9.5 8.88 9.5 7.5 10.62 5 12 5zm0 14.2c-2.5 0-4.7-1.42-5.83-3.5C7.38 14.19 9.5 13.5 12 13.5s4.62.69 5.83 2.7c-1.13 2.08-3.33 3.5-5.83 3.5z"/></svg>');
            background-color: #00aaff; 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 80%;
            border-radius: 50%;
            border: 2px solid white;
            width: 25px;
            height: 25px;
            text-align: center;
            line-height: 25px;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
    <link rel="stylesheet" href="assets/fixes.css">
    <link rel="stylesheet" href="assets/refined.css">
</head>
<body>

<header>
    <div style="display: flex; align-items: center;">
        <span class="logo-text"> إدارة المفتشين الميدانيين</span>
    </div>
</header>

<div class="main-layout">
   <div class="sidebar">
        <a href="dashboard.html"> <i class="fas fa-tachometer-alt"></i> لوحة القيادة</a>
        <a href="alerts_center.html"> <i class="fas fa-bell"></i> مركز التنبيهات</a>
        <a href="analytics_reports.html" > <i class="fas fa-chart-line"></i> التحليل والتقارير</a>
        <a href="device_details.html"> <i class="fas fa-car"></i> تفاصيل المركبة</a>
        <a href="field_inspector_mgt.html" class="active" aria-current="page"> <i class="fas fa-users"></i> إدارة المفتشين</a>
    </div>

    <div class="content">
        <div id="inspector-map"></div>
        
        <div class="inspector-list">
            <h2>قائمة المفتشين الميدانيين</h2>
            <div id="inspector-cards-container">
                </div>
        </div>
    </div>
</div>

<script>
    const CENTER_LAT = 24.7136;
    const CENTER_LNG = 46.6753;

    let map = L.map('inspector-map').setView([CENTER_LAT, CENTER_LNG], 12);
    // تم إضافة خيار 'dark' أو 'light' هنا لتحسين شكل الخريطة، لكن يفضل استخدام خريطة تدعم الثيم الداكن مباشرة إن أمكن.
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // تعريف أيقونة المفتش الميداني
    const createInspectorIcon = (statusColor) => L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="inspector-icon" style="background-color: ${statusColor};"></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 30],
        popupAnchor: [0, -25]
    });

    // بيانات المفتشين
    let INSPECTORS = [
        { id: 101, name: "المفتش خالد", lat: 24.7150, lng: 46.6850, status: 'available', lastUpdate: 'الآن', task: 'لا توجد' },
        { id: 102, name: "المفتش فهد", lat: 24.7250, lng: 46.6700, status: 'on-task', lastUpdate: 'منذ 5 د', task: 'مخالفة سرعة #101' },
        { id: 103, name: "المفتش يوسف", lat: 24.7000, lng: 46.7000, status: 'offline', lastUpdate: 'منذ ساعة', task: 'لا توجد' },
        { id: 104, name: "المفتش ماجد", lat: 24.7350, lng: 46.6800, status: 'available', lastUpdate: 'الآن', task: 'لا توجد' }
    ];

    let inspectorMarkerLayer = L.layerGroup().addTo(map);

    function getStatusInfo(status) {
        if (status === 'available') return { text: 'متاح', class: 'status-available', color: '#1abc9c' };
        if (status === 'on-task') return { text: 'في مهمة', class: 'status-on-task', color: '#ffc107' };
        return { text: 'غير متصل', class: 'status-offline', color: '#dc3545' };
    }

    function renderInspectors() {
        inspectorMarkerLayer.clearLayers();
        const container = document.getElementById('inspector-cards-container');
        container.innerHTML = '';

        INSPECTORS.forEach(inspector => {
            const statusInfo = getStatusInfo(inspector.status);
            
            // 1. إضافة العلامة على الخريطة
            const marker = L.marker([inspector.lat, inspector.lng], { icon: createInspectorIcon(statusInfo.color) })
                .bindPopup(`<strong>${inspector.name}</strong><br>الحالة: ${statusInfo.text}<br>المهمة: ${inspector.task}`)
                .addTo(inspectorMarkerLayer);

            // 2. إنشاء بطاقة القائمة
            const card = document.createElement('div');
            card.classList.add('inspector-card');
            card.innerHTML = `
                <h4>
                    <span>${inspector.name}</span>
                    <span class="inspector-status ${statusInfo.class}">${statusInfo.text}</span>
                </h4>
                <p style="font-size: 12px; margin: 0; color: #a0a0b0;">المهمة: ${inspector.task}</p>
                <p style="font-size: 10px; margin: 0; color: #808090;">آخر تحديث: ${inspector.lastUpdate}</p>
                <button class="assign-btn" onclick="assignTask(${inspector.id}, ${inspector.lat}, ${inspector.lng})">تعيين مهمة</button>
            `;
            container.appendChild(card);
        });
    }

    function assignTask(id, lat, lng) {
        const task = prompt(`تعيين مهمة للمفتش ${id}. أدخل وصف المهمة (مثال: الذهاب إلى 24.7100, 46.6800 للتحقيق):`);
        if (task) {
            const inspector = INSPECTORS.find(i => i.id === id);
            if (inspector) {
                inspector.task = task.substring(0, 30) + (task.length > 30 ? '...' : '');
                inspector.status = 'on-task';
                alert(`تم تكليف المفتش ${inspector.name} بمهمة: ${inspector.task}`);
                map.setView([lat, lng], 14); // التركيز على موقع المفتش
                renderInspectors();
            }
        }
    }

    // دالة محاكاة لحركة المفتشين
    function simulateInspectorMovement() {
        INSPECTORS.forEach(inspector => {
            if (inspector.status !== 'offline') {
                inspector.lat += (Math.random() - 0.5) * 0.0003;
                inspector.lng += (Math.random() - 0.5) * 0.0006;
                inspector.lastUpdate = 'الآن';
            }
        });
        renderInspectors();
    }

    // تشغيل التحديثات اللحظية
    setInterval(simulateInspectorMovement, 5000);
    
    renderInspectors();
</script>
</body>
</html>
